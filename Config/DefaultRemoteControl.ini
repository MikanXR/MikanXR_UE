[/Script/RemoteControlCommon.RemoteControlSettings]
; Lets Plugins/MikanXR_UE/Tools/ue_automate.py run editor Python through the Remote Control HTTP
; API, which stays bound to 127.0.0.1:30010. Greyed out in the settings UI behind Restrict Server
; Access, but the ini value is what the runtime check reads.
bEnableRemotePythonExecution=True
; From 5.6 a remote function call must also be allowlisted: the plugin's debug library, and the
; one Python entry point the client calls. Older engines ignore the unknown key.
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/MikanXR.MikanDebugLibrary")
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/PythonScriptPlugin.PythonScriptLibrary",FunctionName="ExecutePythonCommandEx")
